<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comfort Hands Careers – Apply Now</title><meta name="robots" content="noindex">
<style>
:root{--p:#9d0bd6;--pd:#7a0aa8;--pl:#f8ebff;--ink:#2d1a2a;--mut:#6f6272;--bd:#e6d5ee;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#fcf8fd;color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,#34182d,var(--p));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:42px;background:#fff;border-radius:10px;padding:4px 10px}header h1{font-size:19px;margin:0;font-family:Georgia,serif}
main{max-width:860px;margin:0 auto;padding:18px 14px 70px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(157,11,214,.08)}
h2{font-family:Georgia,serif;font-size:18px;margin:0 0 2px}h3{font-size:14px;background:var(--pl);color:var(--pd);padding:9px 12px;border-radius:7px;margin:18px 0 10px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.s2{grid-column:span 2}
label.l{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);margin-bottom:4px}.req{color:var(--bad)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=password],select,textarea{width:100%;padding:10px 11px;border:1.5px solid var(--bd);border-radius:9px;font:inherit;background:#fdf9ff}
textarea{min-height:80px}input:focus,select:focus,textarea:focus{outline:2px solid var(--p);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{display:flex;gap:7px;align-items:center;border:1.5px solid var(--bd);border-radius:9px;padding:8px 12px;background:#fdf9ff;font-size:14px;cursor:pointer}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}.btn:hover{background:var(--pd)}.btn[disabled]{opacity:.5;cursor:default}
.btn.o{background:#fff;color:var(--ink);border:1.5px solid var(--bd)}
.msg{border-radius:10px;padding:11px 14px;margin:12px 0;font-size:14px;background:#fdf6e3;border:1px solid #e8d49a;color:#7a5a10}.msg.ok{background:#e4f6ea;border-color:#9fd6b3;color:#1c6b3a}.msg.bad{background:#fde8e6;border-color:#f0b4ad;color:var(--bad)}
.consent{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px}.consent p{margin:0 0 8px}
.task{display:flex;align-items:center;gap:12px;border:1.5px solid var(--bd);border-radius:11px;padding:12px 14px;margin:8px 0;background:#fff}.task .t{flex:1;font-weight:600}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;background:#fff3d6;color:#8a5a00}.pill.ok{background:#e4f6ea;color:#1c6b3a}
.doc{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;max-height:55vh;overflow:auto;font-size:14px;background:#fff}.doc p{margin:0 0 9px}
.sig{border:2px dashed #c9a2dc;border-radius:10px;background:#fff;overflow:hidden}.sig canvas{display:block;width:100%;height:130px;touch-action:none;cursor:crosshair}
.hp{position:absolute;left:-5000px;height:1px;overflow:hidden}.grecaptcha-badge{visibility:hidden}.foot{font-size:12px;color:var(--mut);margin-top:16px}
@media(max-width:640px){.g{grid-template-columns:1fr}.s2{grid-column:auto}}

/* ── NEW LAYOUT (same purple): flat sticky top bar, softer cards, accent-bar sections ── */
header{background:#34182d;padding:10px 18px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header img{height:34px;border-radius:9px;padding:3px 9px}header h1{font-size:16px}
body{background:#fcf8fd}
main{padding-top:20px}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(52,24,45,.05);padding:22px 24px}
h3{background:var(--pl);border-left:5px solid var(--p);border-radius:10px;padding:10px 14px;color:#34182d}
label.l{letter-spacing:.06em}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=password],select,textarea{border-radius:9px}
.opt{border-radius:10px}.opt:has(input:checked){border-color:var(--p);background:var(--pl);font-weight:700;color:var(--pd)}
.task{position:relative;overflow:hidden;padding-left:19px;border-radius:12px;box-shadow:0 1px 2px rgba(52,24,45,.05)}
.task:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--p)}
.pill{border-radius:9px;letter-spacing:.02em}
.consent{border-radius:12px;background:#fdfaff}
@media(max-width:640px){.card{padding:16px}header{padding:8px 12px;flex-wrap:nowrap;gap:10px}header img{height:28px}header h1{font-size:14px}}

.aprog{position:sticky;z-index:15;background:rgba(252,248,253,.96);backdrop-filter:blur(4px);margin:-18px -14px 14px;padding:10px 14px 9px;border-bottom:1px solid var(--bd)}
.ap-t{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mut);margin-bottom:6px}.ap-t b{color:var(--ink)}.ap-t span{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-bar{display:flex;gap:3px}.ap-bar i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.ap-bar i.d{background:var(--p)}.ap-bar i.c{background:var(--pd)}
</style></head><body>

  h+='<h3>Upload Resume</h3><input type="file" id="resume" accept=".pdf,.doc,.docx,image/*"><p class="sub">PDF, Word or a photo, up to 6 MB.</p>'+
   '<h3>Consent and Authorizations</h3>'+consentHTML('employer',CONSENT.employer)+consentHTML('background',CONSENT.background)+'<div class="g"><div><label class="l" for="c_date">Date <span class="req">*</span></label><input type="date" id="c_date"></div></div>'+
   '<h3>Consent to SMS Messaging</h3>'+consentHTML('sms',CONSENT.sms)+
   '<div class="hp" aria-hidden="true"><label>Website<input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>'+
   '<div id="amsg"></div><p style="margin-top:14px"><button class="btn" id="abtn" onclick="submitApp()">Submit Application</button></p><p class="foot">'+esc(CONSENT.eeo)+'</p>'+(RECAPTCHA_SITE?'<p class="foot">This site is protected by reCAPTCHA. The Google <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Privacy Policy</a> and <a href="https://policies.google.com/terms" target="_blank" rel="noopener">Terms of Service</a> apply.</p>':'')+'</div>';
  $('main').innerHTML='<div id="aprog" class="aprog"><div class="ap-t"><b id="apN"></b><span id="apS"></span></div><div class="ap-bar" id="apBar"></div></div>'+h; setupProg(); const d=new Date(); $('c_date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function setupProg(){
  const hs=[...document.querySelectorAll('#main .card > h3')], bar=$('apBar'); if(!hs.length||!bar) return;
  bar.innerHTML=hs.map(()=>'<i></i>').join('');
  const hh=document.querySelector('header'); $('aprog').style.top=(hh?hh.offsetHeight:0)+'px';
  const upd=()=>{ if(!$('apBar')){ window.removeEventListener('scroll',upd); return; }
    const line=(hh?hh.offsetHeight:0)+90; let cur=0; hs.forEach((h,i)=>{ if(h.getBoundingClientRect().top<line) cur=i; });
    if(window.innerHeight+window.scrollY>=document.body.scrollHeight-4) cur=hs.length-1;
    $('apN').textContent='Section '+(cur+1)+' of '+hs.length; $('apS').textContent=hs[cur].textContent.replace(/^\d+\.\s*/,'');
    [...bar.children].forEach((b,i)=>b.className=i<cur?'d':(i===cur?'c':'')); };
  window.addEventListener('scroll',upd,{passive:true}); window.addEventListener('resize',upd); upd();
}
function say(id,cls,t){ $(id).innerHTML=t?'<div class="msg '+cls+'">'+t+'</div>':''; if(t) $(id).scrollIntoView({block:'center',behavior:'smooth'}); }
// photos from a phone are shrunk before upload so they fit the size limit
function readFile(file){ return new Promise((res,rej)=>{
  if(!file) return res(null);
  const done=(mime,dataUrl)=>res({name:file.name,mime:mime,b64:dataUrl.slice(dataUrl.indexOf(',')+1)});
  const fr=new FileReader(); fr.onerror=()=>rej(new Error('Could not read that file.'));
  fr.onload=()=>{ if(!/^image\//.test(file.type)) return done(file.type||'application/pdf',fr.result);
    const im=new Image(); im.onerror=()=>rej(new Error('Could not read that picture.')); im.onload=()=>{ const m=2000, k=Math.min(1,m/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); done('image/jpeg',c.toDataURL('image/jpeg',.85)); }; im.src=fr.result; };
  fr.readAsDataURL(file); }); }
const RECAPTCHA_SITE=''; // paste your reCAPTCHA v3 SITE key here (the public one)
function captchaToken(){ return new Promise(res=>{ if(!RECAPTCHA_SITE) return res(''); let done=false; const fin=v=>{ if(!done){ done=true; res(v); } }; setTimeout(()=>fin(''),8000);
  try{ grecaptcha.ready(()=>grecaptcha.execute(RECAPTCHA_SITE,{action:'apply'}).then(fin,()=>fin(''))); }catch(e){ fin(''); } }); }
if(RECAPTCHA_SITE){ const s=document.createElement('script'); s.src='https://www.google.com/recaptcha/api.js?render='+RECAPTCHA_SITE; s.async=true; document.head.appendChild(s); }
async function submitApp(){
  const app={}; let miss='';
  SECTIONS.forEach(s=>s[2].forEach(f=>{ const v=val(f); app[f[0]]=v; if(f[4]&&!(Array.isArray(v)?v.length:String(v).trim())&&!miss) miss=f[1]; }));
  if(miss) return say('amsg','bad','Please fill in: '+esc(miss));
  const c=k=>(document.querySelector('input[name="c_'+k+'"]:checked')||{}).value||'';
  app.consentEmployer=c('employer'); app.consentBackground=c('background'); app.consentSms=c('sms'); app.consentDate=$('c_date').value;
  if(!app.consentEmployer||!app.consentBackground) return say('amsg','bad','Please answer both authorizations (Yes or No).');
  if(!app.consentDate) return say('amsg','bad','Please enter the date.');
  const file=$('resume').files[0]; if(file&&file.size>6*1024*1024&&!/^image\//.test(file.type)) return say('amsg','bad','The resume file is larger than 6 MB.');
  $('abtn').disabled=true; say('amsg','','Sending your application…');
  try{ const resume=await readFile(file); const j=await api({action:'applySubmit',app:app,resume:resume,website:$('website').value,captcha:await captchaToken()});
    if(j.ok){ $('main').innerHTML='<div class="card"><h2>Thank you, '+esc(app.firstName)+'.</h2><p>We received your application for '+esc(app.position)+'. We will review it and contact you by email or phone.</p><p class="sub">Questions? Call 609-277-3032.</p></div>'; window.scrollTo(0,0); return; }
    say('amsg','bad',esc(j.error||'Could not send the application.'));
  }catch(e){ say('amsg','bad','Could not reach our office system. Check your connection and try again.'); }
  $('abtn').disabled=false;
}

/* ───────── new-hire page (personal link) ───────── */
const AID=(new URLSearchParams(location.search).get('a')||'').replace(/[^a-z0-9_-]/gi,'');
let TOK='', ST=null, ink=false;
try{ const s=JSON.parse(sessionStorage.getItem('chhc_app')||'null'); if(s&&s.id===AID&&s.exp>Date.now()) TOK=s.token; }catch(e){}
function renderLogin(sent){
  $('hTitle').textContent='Comfort Hands – New Hire Forms';
  $('main').innerHTML='<div class="card"><h2>Welcome</h2><p>To protect your information, we email a 6-digit code to the address on your application each time you open this page.</p>'+
   (sent?'<div class="msg ok">If this link is valid, a code was just emailed to you. It works for 15 minutes. Check your spam folder too.</div><div style="max-width:260px"><label class="l" for="code">6-digit code</label><input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><div id="lmsg"></div><p><button class="btn" onclick="login()">Continue</button> <button class="btn o" onclick="sendCode()">Send a new code</button></p>'
        :'<div id="lmsg"></div><p><button class="btn" id="cbtn" onclick="sendCode()">Email me a code</button></p>')+'</div>';
}
async function sendCode(){ try{ await api({action:'applicantCode',id:AID}); renderLogin(true); }catch(e){ say('lmsg','bad','Could not reach our office system. Try again.'); } }
async function login(){
  const code=$('code').value.trim(); if(!/^\d{6}$/.test(code)) return say('lmsg','bad','Enter the 6-digit code from the email.');
  try{ const j=await api({action:'applicantLogin',id:AID,code:code}); if(!j.ok) return say('lmsg','bad','That code is not valid or has expired. Send a new code.');
    TOK=j.token; try{ sessionStorage.setItem('chhc_app',JSON.stringify({id:AID,token:TOK,exp:j.exp})); }catch(e){} loadState();
  }catch(e){ say('lmsg','bad','Could not reach our office system. Try again.'); }
}
async function call(body){ const j=await api(Object.assign({token:TOK},body)); if(!j.ok&&j.error==='unauthorized'){ TOK=''; try{sessionStorage.removeItem('chhc_app');}catch(e){} renderLogin(false); throw new Error('expired'); } return j; }
async function loadState(){ $('main').innerHTML='<p class="sub">Loading…</p>'; try{ const j=await call({action:'applicantGet'}); if(j.ok){ ST=j; renderTasks(); } }catch(e){ if(e.message!=='expired') $('main').innerHTML='<div class="msg bad">Could not load your forms. Refresh the page to try again.</div>'; } }
const I9A=['U.S. Passport or U.S. Passport Card','Permanent Resident Card (Form I-551)','Employment Authorization Document with photo (Form I-766)','Foreign passport with temporary I-551 stamp or printed notation','Other List A document'];
const I9B=['Driver\'s license or state ID card','School ID card with photograph','Voter registration card','U.S. military card or draft record','Other List B document'];
const I9C=['Social Security card (unrestricted)','U.S. birth certificate (original or certified copy)','Certification of report of birth issued by the Department of State','Native American tribal document','Other List C document'];
function renderTasks(msg){
  $('hTitle').textContent='Comfort Hands – New Hire Forms';
  const up={}; ST.uploads.forEach(u=>{ up[u.k]=u; }); const left=ST.forms.filter(f=>!f.done).length;
  const pill=d=>'<span class="pill '+(d?'ok':'')+'">'+(d?'Done ✓':'To do')+'</span>';
  const upRow=(k,label,help,opts)=>'<div class="task" style="flex-wrap:wrap"><div class="t">'+esc(label)+(help?'<div class="sub" style="font-weight:400;margin:2px 0 0">'+help+'</div>':'')+'</div>'+pill(up[k].done)+
     '<div style="flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+(opts?'<select id="dt_'+k+'" style="max-width:330px"><option value="">— Which document? —</option>'+opts.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>':'')+
     '<input type="file" id="up_'+k+'" accept=".pdf,image/*" style="max-width:260px"><button class="btn o" onclick="upload(\''+k+'\')">Upload</button></div></div>';
  $('main').innerHTML=(msg?'<div class="msg ok">'+msg+'</div>':'')+'<div class="card"><h2>Hello '+esc(ST.first)+'</h2><p class="sub">Position: '+esc(ST.position||'')+'. Your details from the application are already filled in. Review each form, sign it on screen, then upload your documents. You can stop and come back with the same link.</p>'+
   '<h3>1. Forms to sign'+(left?' ('+left+' left)':' (all done)')+'</h3>'+ST.forms.map(f=>'<div class="task"><div class="t">'+esc(f.title)+'</div>'+pill(f.done)+(f.done?'':'<button class="btn" onclick="openForm(\''+f.k+'\')">Review &amp; sign</button>')+'</div>').join('')+
   '<h3>2. Signed employment contract</h3>'+upRow('contract','Upload your signed contract','The contract was attached to your offer email. Sign it, then upload a scan or clear photo of every page as one PDF, or call the office if you need help.')+
   '<h3>3. Identification documents</h3><p class="sub">For Form I-9 you choose which documents to show: <b>one document from List A</b>, or <b>one from List B plus one from List C</b>. See the <a href="'+esc(ST.i9Url)+'" target="_blank" rel="noopener">official list of acceptable documents</a>. Upload a clear photo or scan of each. Bring the originals on your first day.</p>'+
   upRow('ssncard','Social Security card','Needed for payroll. It also counts as your List C document.')+upRow('i9a','List A document (identity and work authorization)','Choose this, or List B and C below.',I9A)+upRow('i9b','List B document (identity)','',I9B)+upRow('i9c','List C document (work authorization)','Only if you are not using your Social Security card.',I9C)+
   '<h3>4. Other</h3>'+upRow('physical','Completed physical examination (if you have it)','')+upRow('other','Any other document the office asked for','')+
   '<div id="tmsg"></div><p class="foot">Form W-4 and Form I-9 are completed with the office. Questions? Call 609-277-3032.</p></div>';
  window.scrollTo(0,0);
}
async function upload(k){
  const file=$('up_'+k).files[0], dt=($('dt_'+k)||{}).value||''; if(!file) return say('tmsg','bad','Choose a file first.');
  if($('dt_'+k)&&!dt) return say('tmsg','bad','Choose which document this is.');
  if(file.size>6*1024*1024&&!/^image\//.test(file.type)) return say('tmsg','bad','That file is larger than 6 MB.');
  say('tmsg','','Uploading…');
  try{ const f=await readFile(file); const j=await call({action:'applicantUpload',kind:k,docType:dt,file:f}); if(!j.ok) return say('tmsg','bad',esc(j.error||'Upload failed.')); ST=j; renderTasks('Uploaded. Thank you.'); }
  catch(e){ if(e.message!=='expired') say('tmsg','bad',esc(e.message&&!/fetch/i.test(e.message)?e.message:'Could not upload. Check your connection and try again.')); }
}
function openForm(k){
  const f=ST.forms.find(x=>x.k===k); ink=false;
  $('main').innerHTML='<div class="card"><h2>'+esc(f.title)+'</h2><p class="sub">Read the whole document, check your details, then sign.</p>'+(f.pre||'')+'<div class="doc">'+f.html+'</div>'+(f.post||'')+'<h3>Your details</h3><div class="g">'+
   f.fields.map(q=>q.type==='yn'?'<div class="s2"><label class="l" for="q_'+q.id+'">'+esc(q.label)+' <span class="req">*</span></label><select id="q_'+q.id+'"><option value="">— Choose —</option><option>Yes</option><option>No</option></select></div>':q.type==='check'?'<label class="opt s2"><input type="checkbox" id="q_'+q.id+'"> '+esc(q.label)+'</label>':'<div><label class="l" for="q_'+q.id+'">'+esc(q.label)+(q.req?' <span class="req">*</span>':'')+'</label><input type="text" id="q_'+q.id+'" value="'+esc(q.value||'')+'"'+(q.secret?' autocomplete="off"':'')+'></div>').join('')+
   '</div><h3>Signature</h3><div class="sig"><canvas id="pad"></canvas></div><p class="sub"><button class="btn o" style="padding:6px 14px" onclick="clearPad()">Clear</button> Sign with your finger or mouse. Signing here has the same effect as signing on paper.</p><div id="fmsg"></div>'+
   '<p><button class="btn" id="sbtn" onclick="signForm(\''+k+'\')">Sign and submit</button> <button class="btn o" onclick="renderTasks()">Back</button></p></div>';
  window.scrollTo(0,0); bindPad();
}
function bindPad(){ const c=$('pad'), r=window.devicePixelRatio||1; c.width=c.clientWidth*r; c.height=130*r; const x=c.getContext('2d'); x.scale(r,r); x.lineWidth=2.4; x.lineCap='round'; x.strokeStyle='#2d1a2a'; let on=false,l=null;
  const p=e=>{ const b=c.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
  c.onpointerdown=e=>{ e.preventDefault(); on=true; l=p(e); try{c.setPointerCapture(e.pointerId);}catch(_){} x.beginPath(); x.arc(l.x,l.y,1.1,0,6.3); x.fill(); ink=true; };
  c.onpointermove=e=>{ if(!on) return; const q=p(e); x.beginPath(); x.moveTo(l.x,l.y); x.lineTo(q.x,q.y); x.stroke(); l=q; };
  c.onpointerup=c.onpointercancel=()=>{ on=false; }; }
function clearPad(){ const c=$('pad'); c.getContext('2d').clearRect(0,0,c.width,c.height); ink=false; }
async function signForm(k){
  const f=ST.forms.find(x=>x.k===k), fields={};
  for(const q of f.fields){ const el=$('q_'+q.id); fields[q.id]=q.type==='check'?el.checked:el.value.trim(); if(q.req&&!fields[q.id]) return say('fmsg','bad','Please fill in: '+esc(q.label)); }
  if(!ink) return say('fmsg','bad','Please sign in the box.');
  $('sbtn').disabled=true; say('fmsg','','Signing…');
  try{ const j=await call({action:'applicantSign',form:k,fields:fields,sig:$('pad').toDataURL('image/png')}); if(!j.ok){ $('sbtn').disabled=false; return say('fmsg','bad',esc(j.error||'Could not sign.')); } ST=j; renderTasks('Signed and filed: '+esc(f.title)+'.'); }
  catch(e){ if(e.message!=='expired'){ $('sbtn').disabled=false; say('fmsg','bad','Could not reach our office system. Try again.'); } }
}
if(AID){ if(TOK) loadState(); else renderLogin(false); } else renderApply();
</script></body></html>
